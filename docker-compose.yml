services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riders_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/riders_connect?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: 8080
      APP_ENV: production
      SMTP_HOST: smtp.yandex.ru
      SMTP_PORT: 587
      SMTP_FROM: pudo-aleksej@yandex.ru
      SMTP_PASS: eodgnjsbffcnhqkt
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
