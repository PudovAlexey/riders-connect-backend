# Single-VPS deploy that needs ONLY this (public) repo — the frontend is shipped
# prebuilt in ./dist, so no access to the private frontend repo is required.
# Brought up by deploy/up.sh. Run from the deploy/ directory.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riders_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/riders_connect?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      PORT: 8080
      CORS_ORIGINS: "*"
      UPLOAD_BASE_URL: ${PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists the Let's Encrypt cert across restarts
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

# Провайдер режет исходящий IPv4 SMTP — письма с кодом уходят к smtp.yandex.ru
# только по IPv6. Дефолтный bridge IPv6 не имеет, поэтому включаем его на сети.
# Глобальный IPv6 контейнер получает через NAT66 (daemon.json: "ip6tables": true).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d0c:e6::/64
